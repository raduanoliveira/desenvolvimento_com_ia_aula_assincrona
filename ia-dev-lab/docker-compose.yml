services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    working_dir: /var/www/html
    entrypoint:
      - /bin/sh
      - -c
      - sed -i 's/\r$//' docker-entrypoint.sh && exec /bin/sh docker-entrypoint.sh
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    entrypoint:
      - /bin/sh
      - -c
      - sed -i 's/\r$//' docker-entrypoint.sh && exec /bin/sh docker-entrypoint.sh
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  backend_vendor:
